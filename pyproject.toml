[project]
name = "health-insight"
version = "0.1.0"
description = "Medicare RAG Retrieval and Question Answering System"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pymupdf>=1.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "numpy>=1.26.0",
    "loguru>=0.7.3",
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "pytest>=9.1.1",
    "fastembed>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]


